<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - QuizMaster</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
        }
        .leaderboard-table th, .leaderboard-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        .leaderboard-table th {
            font-weight: 700;
            color: var(--text-secondary);
            background-color: var(--bg-color);
        }
        .leaderboard-table tr:last-child td {
            border-bottom: none;
        }
        .rank-1 { color: #fbbf24; font-weight: bold; } /* Gold */
        .rank-2 { color: #94a3b8; font-weight: bold; } /* Silver */
        .rank-3 { color: #b45309; font-weight: bold; } /* Bronze */
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="nav-brand">
                <span>QuizMaster</span>
            </a>
            <button class="mobile-menu-btn">☰</button>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="leaderboard.html" class="nav-link active">Leaderboard</a></li>
                <li><a href="admin.html" class="nav-link">Admin Panel</a></li>
                <li><a href="about.html" class="nav-link">About</a></li>
                <li><button class="btn btn-icon theme-toggle" aria-label="Toggle dark mode">🌙</button></li>
            </ul>
        </div>
    </nav>

    <main class="container mt-8 mb-8" style="max-width: 800px;">
        <div class="glass-card p-0 animate-fade-in overflow-hidden">
            <div class="p-6 text-center" style="border-bottom: 1px solid var(--border-color);">
                <h2 class="text-primary">Global Leaderboard 🏆</h2>
                <p class="text-secondary mt-2">Top performers on the QuizMaster platform.</p>
            </div>
            
            <div style="overflow-x: auto;">
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th style="width: 10%;">Rank</th>
                            <th>Player Name</th>
                            <th>Date</th>
                            <th style="text-align: right;">Score</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
            
            <div id="no-data-msg" class="p-8 text-center text-secondary hidden">
                No records found. Be the first to take the quiz!
            </div>
        </div>
        
        <div class="text-center mt-6">
            <a href="about.html" class="btn btn-primary">Take Quiz Now</a>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 QuizMaster Platform. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/theme.js"></script>
    <script src="js/app.js"></script>
    <script src="js/leaderboard.js"></script>
</body>
</html>
